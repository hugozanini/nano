name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Also run integration tests against the nano_test dataset'
        type: boolean
        default: false
  # Weekly, because the integration tier is the only thing that notices the
  # world changing underneath us: Gemini output drifting between model
  # versions, a BigQuery or Firestore behaviour changing, the ECB feed moving.
  # None of that is caused by a commit, so nothing else would ever catch it.
  schedule:
    - cron: '0 6 * * 1'

# Cancelling superseded runs is only right on a pull request, where nobody
# cares about the result for an intermediate commit. On the default branch each
# run is a historical record of whether that commit was good, and a cancelled
# run is indistinguishable from a failed one at a glance — it makes main look
# broken when it is not. The event is part of the group as well, so a manual
# dispatch and a push never contend: they are different intents, and one killing
# the other is never what was wanted.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -r requirements-dev.txt

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Unit tests
        # Unit tests are hermetic: conftest blocks real HTTP and forces test-only
        # resource names, so this needs no credentials.
        run: .venv/bin/python -m pytest tests/unit -q

  routing:
    name: Model routing (prompt changes)
    runs-on: ubuntu-latest
    # The narrow slice of the integration tier that must not wait for the weekly
    # run. Prompt routing is decided by the model, so a unit test cannot check
    # it — the fake returns whatever the test queued. Proven the hard way: the
    # conversation-context fix passed every unit test and changed the model's
    # answer by nothing at all, because a function description outweighed it.
    #
    # Cheap enough to run on a PR where the full tier is not: a few dozen small
    # Gemini calls, no BigQuery, no Firestore, no storage.
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch'
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          # The path filter compares against the base, which needs shared
          # history. The default shallow clone has none, and the first version
          # of this job failed the diff, matched nothing, and reported success
          # having run no tests at all.
          fetch-depth: 0

      - name: Did this change how anything is classified?
        id: changed
        run: |
          base="${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.before }}"
          # Every uncertain path leads to running the tests. A filter that
          # cannot tell must not be the reason a guard goes quiet.
          if ! changed=$(git diff --name-only "$base"...HEAD 2>/dev/null); then
            echo "cannot diff against '$base' — running the tests"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          if echo "$changed" | grep -qE '^app/nano/(gemini|handlers|analytics)\.py$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.changed.outputs.run == 'true'
        with:
          enable-cache: true

      - id: auth
        if: steps.changed.outputs.run == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_TESTS_SA }}

      - name: Set up Python
        if: steps.changed.outputs.run == 'true'
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt

      - name: Routing tests
        if: steps.changed.outputs.run == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          # Required by the tier's credential check; these tests touch neither.
          BQ_DATASET: nano_test
          FIRESTORE_PREFIX: nano_test_
        run: .venv/bin/python -m pytest tests/integration/test_classification_real.py -q

      - name: Say so when nothing ran
        if: steps.changed.outputs.run != 'true'
        run: echo "::notice::No classification file changed — routing tests skipped."

  integration:
    name: Integration tests (nano_test)
    runs-on: ubuntu-latest
    # Not on a PR: these hit real BigQuery, Firestore and Vertex AI, which costs
    # money and is rate-limited. On demand, or weekly to catch drift.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration)
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # A dedicated identity, not the deploy account. It holds only what the
          # tests need: BigQuery job-runner plus WRITER on the nano_test dataset
          # alone, Firestore, Vertex AI, and the receipts bucket. It has no
          # access to the production `nano` dataset at all, so a compromised CI
          # token cannot reach the household's real purchase history.
          service_account: ${{ secrets.GCP_CI_TESTS_SA }}

      - name: Set up Python
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -r requirements-dev.txt

      - name: Integration tests
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET: nano_test
          FIRESTORE_PREFIX: nano_test_
          RECEIPTS_BUCKET: ${{ secrets.RECEIPTS_BUCKET }}
        run: .venv/bin/python -m pytest tests/integration -m integration -q
