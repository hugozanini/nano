name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -r requirements-dev.txt

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Unit tests
        run: .venv/bin/python -m pytest tests/unit -q

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      # `env_vars` below is comma-or-newline delimited, and a value containing a
      # comma is split at parse time rather than escaped. That is what shredded
      # HOUSEHOLD_NUMBERS in production into one truncated variable plus two
      # bogus ones named after the remaining phone numbers, so Nano only ever
      # messaged one person. The fix is to keep commas out of values entirely:
      # household entries are semicolon-separated, and the app parses ";", "|"
      # or ",". This step fails the deploy rather than ship a mangled list.
      #
      # (`env_vars_file` would also work and needs no escaping, but the action
      # has deprecated it for removal in a future major version.)
      - name: Validate environment secrets
        env:
          HOUSEHOLD_MEMBERS: ${{ secrets.HOUSEHOLD_MEMBERS }}
          VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
        run: |
          python3 - <<'PY'
          import os, sys

          problems = []
          for key in ("VERIFY_TOKEN", "PHONE_NUMBER_ID", "HOUSEHOLD_MEMBERS"):
              if not os.environ.get(key):
                  problems.append(f"{key} is empty or unset")

          members = os.environ.get("HOUSEHOLD_MEMBERS", "")
          if "," in members:
              problems.append(
                  "HOUSEHOLD_MEMBERS contains a comma, which the deploy action "
                  "splits on. Use ';' between entries: '<number>:name;<number>:name'"
              )
          if members != members.strip().strip('"\''):
              problems.append("HOUSEHOLD_MEMBERS has stray surrounding quotes")
          if members and not any(c.isdigit() for c in members):
              problems.append("HOUSEHOLD_MEMBERS contains no digits")

          if problems:
              print("Environment validation failed:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)

          entries = [e for e in members.split(";") if e.strip()]
          print(f"validated {len(entries)} household entries")
          PY

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nano-webhook
          region: us-central1
          source: ./app
          env_vars: |
            VERIFY_TOKEN=${{ secrets.VERIFY_TOKEN }}
            PHONE_NUMBER_ID=${{ secrets.PHONE_NUMBER_ID }}
            HOUSEHOLD_MEMBERS=${{ secrets.HOUSEHOLD_MEMBERS }}
            HOUSEHOLD_TIMEZONE=${{ secrets.HOUSEHOLD_TIMEZONE }}
            RECEIPTS_BUCKET=${{ secrets.RECEIPTS_BUCKET }}
            TASKS_TARGET_URL=${{ secrets.TASKS_TARGET_URL }}
            TASKS_INVOKER_SA=${{ secrets.TASKS_INVOKER_SA }}
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            REQUIRE_SIGNATURE=${{ vars.REQUIRE_SIGNATURE || 'false' }}
            BQ_DATASET=nano
            TASK_BACKEND=cloud_tasks
            TASKS_QUEUE=nano-webhook-work
            TASKS_LOCATION=us-central1
            VERTEX_LOCATION=us-central1
            DEFAULT_CURRENCY=EUR
            LOG_LEVEL=INFO
          # Authoritative rather than merged. The default "merge" left the
          # shredded HOUSEHOLD_NUMBERS from the old pipeline on the service,
          # along with two junk variables named after phone numbers, long after
          # the value was fixed. Declaring the environment means what is in this
          # file is exactly what runs. Both strategies are independent, and the
          # secrets block below lists every mount, so neither drops anything.
          env_vars_update_strategy: overwrite
          secrets: |
            WHATSAPP_ACCESS_TOKEN=whatsapp-access-token:latest
            WHATSAPP_APP_SECRET=whatsapp-app-secret:latest
          secrets_update_strategy: overwrite
          # --clear-base-image drops the automatic base image that buildpacks
          # attached on earlier deploys. Cloud Run refuses a Dockerfile build
          # while one is still associated with the service.
          flags: >-
            --service-account=${{ secrets.GCP_RUNTIME_SA }}
            --allow-unauthenticated
            --clear-base-image

      # A deploy that produces a service which cannot answer is worse than a
      # failed deploy, because Meta keeps posting to it.
      - name: Smoke test the new revision
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          echo "checking ${URL}/health"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.txt -w '%{http_code}' "${URL}/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy: $(cat /tmp/health.txt)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}; retrying"
            sleep 5
          done
          echo "service did not become healthy"
          exit 1
