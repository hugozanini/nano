name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nano-webhook
          region: us-central1
          source: ./app
          # WARNING: `env_vars` is COMMA-delimited. Any value containing a comma is
          # silently split into extra bogus variables. HOUSEHOLD_NUMBERS is exactly
          # that shape and is currently mangled in production — it is migrated to a
          # comma-safe mechanism in the webhook-hardening PR, together with the fix
          # that stops an undeliverable recipient from failing the request.
          # Do not "fix" the variable here first: on the current code a newly
          # reachable, permanently-blocked number would raise inside the handler.
          env_vars: |
            VERIFY_TOKEN=${{ secrets.VERIFY_TOKEN }}
            PHONE_NUMBER_ID=${{ secrets.PHONE_NUMBER_ID }}
            HOUSEHOLD_NUMBERS="${{ secrets.HOUSEHOLD_NUMBERS }}"
          secrets: |
            WHATSAPP_ACCESS_TOKEN=whatsapp-access-token:latest
          flags: --service-account=${{ secrets.GCP_RUNTIME_SA }} --allow-unauthenticated